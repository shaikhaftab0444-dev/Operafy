<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =====================================================
   ANIMATED GRADIENT BG
===================================================== */
.animated-gradient {
    background: linear-gradient(-45deg, #87CEEB, #FFFFFF, #87CEEB, #FFFFFF, #87CEEB);
    background-size: 400% 400%;
    animation: gradient-animation 20s ease infinite;
}
@keyframes gradient-animation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* =====================================================
   HEADER
===================================================== */
.ait-header {
    width: 100%;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    position: fixed;     
    top:    0px;
    left: 0;
    z-index: 9999;       

}


.ait-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 60px;
}

/* LOGO */
.ait-logo img {
    height: 50px;
}

/* =====================================================
   MENU LEFT (Corrected)
===================================================== */
.ait-nav {
    display: flex;
    gap: 15px;
    margin-left: auto;   /* pushes menu to Right Side */
}



/* MENU ITEMS (FINAL — NO DUPLICATE) */
.ait-nav a {
    position: relative;
    font-family: "Inter", sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    color: #2e3a45;
    padding: 8px 14px;         /* Ye line height sahi rakhti */
    border-radius: 8px;
    transition: 0.3s ease;
}

/* BOX-TYPE HOVER */
.ait-nav a:hover {
    background: #edf5ff;
    color: #2563eb;
    box-shadow: 0 3px 10px rgba(0,0,0,0.10);
    transform: translateY(-2px);
}


/* =====================================================
   RIGHT SIDE BUTTONS
===================================================== */
.ait-actions {
    display: flex;
    align-items: center;
    gap: 15px;
}

.btn-contact,
.btn-enroll {
    padding: 8px 18px;
    border-radius: 25px;
    font-size: 13px;
    text-decoration: none;
    font-family: "Inter", sans-serif;
    transition: 0.25s ease;
}

/* CONTACT BUTTON */
.btn-contact {
    border: 2px solid #d3e9f7;
    background: rgba(255,255,255,0.6);
    color: #1d2d3b;
    margin-left: 15px;
}
.btn-contact:hover {
    background: #e9f4ff;
    transform: translateY(-3px);
}

/* ENROLL BUTTON */
.btn-enroll {
    background: #2563eb;
    color: white;
    font-weight: 600;
    font-weight: bold;
}
.btn-enroll:hover {
    background: #0b63e0;
    transform: translateY(-3px);
}

/* =====================================================
   MOBILE BUTTON
===================================================== */
.mobile-menu-btn {
    display: none;
    font-size: 32px;
    cursor: pointer;
    position: absolute;
    right: 20px;
    top: 18px;
}

/* MOBILE MENU PANEL */
.mobile-panel {
    display: none;
    flex-direction: column;
    background: white;
    padding: 25px 20px;
    gap: 18px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    position: fixed;
    top: 75px;
    left: 0;
    width: 100%;
    z-index: 99999; /* FIX */
}


.mobile-panel a {
    font-size: 16px;
    text-decoration: none;
    color: #2e3a45;
    position: relative;
    padding-bottom: 4px;
    transition: 0.3s ease;
}

/* HOVER EFFECT — underline slide + color change */
.mobile-panel a:hover {
    color: #0056b3;
}

.mobile-panel a::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 0%;
    height: 2px;
    background: #0056b3;
    transition: 0.3s ease;
    transform: translateX(-50%);
}
.mobile-panel.active {
    display: flex !important;
}

.mobile-panel a:hover::after {
    width: 60%;
}

/* CONTACT & ENROLL BUTTONS */
.mobile-panel .btn-contact,
.mobile-panel .btn-enroll {
    width: 60%;
    margin: auto;
    border-radius: 12px;
}


/* =====================================================
   RESPONSIVE
===================================================== */
@media (max-width: 992px) {
    .ait-container {
        padding: 12px 20px;
    }

    .ait-nav,
    .ait-actions {
        display: none;
    }

    .mobile-menu-btn {
        display: block;
        top: 14px;
    }

    .ait-logo img {
        height: 46px;
    }

    .mobile-panel {
        top: 70px;
    }
}

/* ✅ FIX: Auto-close menu on desktop size */
@media (min-width: 993px) {
    #mobileMenu {
        display: none !important;
    }
}

</style>
</head>

<body>

<header class="ait-header animated-gradient" >
    <div class="ait-container">

        <!-- LEFT: LOGO -->
        <div class="ait-logo">
            <img src="New_Ait_Logo.png" alt="AIT Logo">
        </div>

        <!-- CENTER: MENU ITEMS -->
        <nav class="ait-nav">
            <a href="https://aitaurangabad.com/">Home</a>
            <a href="https://aitaurangabad.com/Courses.html">Courses</a>
            <a href="https://aitaurangabad.com/Syllabus.html">Syllabus</a>
            <a href="https://aitaurangabad.com/UserPanel/Login.aspx">Student Login</a>
            <a href="https://aitaurangabad.com/Exam.html">Exam</a>
            <a href="https://aitaurangabad.com/WebsiteUnderConstruction.html">Gallery</a>
            <a href="https://aitaurangabad.com/About.html">About Us</a>
            <a href="https://aitaurangabad.com/Contact%20Us.html">Contact</a>     
        </nav>

        <!-- RIGHT: CONTACT + ENROLL -->
        <div class="ait-actions">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSf9HnApVLCZcD2fW4zsMcFSjC52jMZEJF1RtSzrTumoYKGCRQ/viewform" class="btn-enroll">Enroll Now</a>
        </div>

        <!-- MOBILE MENU ICON -->
        <div class="mobile-menu-btn" id="menuBtn">☰</div>

    </div>
</header>

<!-- MOBILE MENU -->
<div class="mobile-panel" id="mobileMenu">
    <a href="https://aitaurangabad.com/">Home</a>
    <a href="https://aitaurangabad.com/Courses.html">Courses</a>
    <a href="https://aitaurangabad.com/Syllabus.html">Syllabus</a>
    <a href="https://aitaurangabad.com/UserPanel/Login.aspx">Student Login</a>
    <a href="https://aitaurangabad.com/Exam.html">Exam</a>
    <a href="https://aitaurangabad.com/WebsiteUnderConstruction.html">Gallery</a>
    <a href="https://aitaurangabad.com/About.html">About Us</a>
    <a href="https://aitaurangabad.com/Contact%20Us.html" class="btn-contact">Contact</a>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSf9HnApVLCZcD2fW4zsMcFSjC52jMZEJF1RtSzrTumoYKGCRQ/viewform" class="btn-enroll">Enroll Now</a>
</div>

<!-- JS -->
<script>
const btn = document.getElementById("menuBtn");
const panel = document.getElementById("mobileMenu");

// Mobile toggle
if (btn && panel) {
    btn.addEventListener("click", () => {
        panel.classList.toggle("active");
    });
}

// Auto close menu on resize
window.addEventListener("resize", () => {
    if (window.innerWidth > 992 && panel && panel.classList.contains("active")) {
        panel.classList.remove("active");
    }
});

// Dynamic Header Spacing
function adjustHeaderSpace() {
    const header = document.querySelector('.ait-header');
    if (!header) return;
    const hHeight = header.offsetHeight;
    document.querySelectorAll('.responsive-padding, .header-space').forEach(el => {
        el.style.paddingTop = (hHeight + 15) + 'px';
    });
}
window.addEventListener('load', adjustHeaderSpace);
window.addEventListener('resize', adjustHeaderSpace);
document.addEventListener('DOMContentLoaded', adjustHeaderSpace);
adjustHeaderSpace();
</script>



</body>
</html>
